<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>给最爱的老婆 ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1f0812 0%, #090205 100%);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .center-tip {
      position: fixed;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 160, 190, 0.75);
      font-size: 14px;
      letter-spacing: 3px;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 77, 136, 0.8);
      animation: fadePulse 2.5s infinite ease-in-out;
      white-space: nowrap;
    }
    @keyframes fadePulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>
  <div class="center-tip">点一点屏幕 · 满屏都是老婆</div>

  <script>
    // 阻止微信浏览器下拉橡皮筋效果
    document.body.addEventListener('touchmove', function (e) {
      e.preventDefault();
    }, { passive: false });

    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, dpr;
    let particles = [];
    let burstParticles = [];
    const TEXT = "老婆";

    // 经典心形参数方程
    function heartFunction(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
      initHeartParticles();
    }

    // 初始化组成爱心的“老婆”粒子
    function initHeartParticles() {
      particles = [];
      // 根据屏幕宽度自适应爱心大小
      const baseScale = Math.min(width, height) / 38;

      // 多层轮廓 + 内部填充，让爱心更饱满
      const layers = [
        { count: 75, scaleRatio: 1.0, size: 13, alpha: 0.95 },
        { count: 55, scaleRatio: 0.82, size: 11, alpha: 0.75 },
        { count: 38, scaleRatio: 0.62, size: 10, alpha: 0.55 },
        { count: 22, scaleRatio: 0.40, size: 9, alpha: 0.40 }
      ];

      layers.forEach((layer, layerIdx) => {
        for (let i = 0; i < layer.count; i++) {
          const t = (Math.PI * 2 * i) / layer.count + layerIdx * 0.15;
          const pos = heartFunction(t);
          // 加入轻微随机偏移，更有呼吸灵动感
          const jitterX = (Math.random() - 0.5) * 6;
          const jitterY = (Math.random() - 0.5) * 6;

          particles.push({
            baseX: pos.x * baseScale * layer.scaleRatio + jitterX,
            baseY: pos.y * baseScale * layer.scaleRatio + jitterY,
            size: layer.size,
            alpha: layer.alpha,
            phase: Math.random() * Math.PI * 2,
            hue: 335 + Math.random() * 20 // 粉红到玫红渐变
          });
        }
      });
    }

    // 点击屏幕生成的飘散“老婆”粒子
    function createBurst(x, y) {
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.3;
        const speed = 1.5 + Math.random() * 3;
        burstParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          alpha: 1,
          size: 12 + Math.random() * 4,
          life: 1
        });
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      createBurst(e.clientX, e.clientY);
    });

    let time = 0;
    function animate() {
      time += 0.045;

      // 拖尾清屏，营造柔和残影
      ctx.fillStyle = 'rgba(12, 3, 7, 0.28)';
      ctx.fillRect(0, 0, width, height);

      // 模拟真实心跳的“双搏”节奏 (咚-咚---停)
      const beatRaw = Math.sin(time * 2.2) + 0.45 * Math.sin(time * 4.4);
      const heartBeat = 1 + Math.max(0, beatRaw) * 0.09;

      const centerX = width / 2;
      const centerY = height / 2 - 15;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 绘制主爱心文字
      particles.forEach((p) => {
        const wave = Math.sin(time * 2 + p.phase) * 2.5;
        const x = centerX + p.baseX * heartBeat + wave * 0.4;
        const y = centerY + p.baseY * heartBeat + wave * 0.4;

        const currentSize = p.size * (0.95 + (heartBeat - 1) * 1.4);
        ctx.font = `bold ${currentSize.toFixed(1)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
        ctx.fillStyle = `hsla(${p.hue}, 95%, 70%, ${p.alpha})`;
        ctx.shadowColor = 'rgba(255, 60, 120, 0.65)';
        ctx.shadowBlur = 8;
        ctx.fillText(TEXT, x, y);
      });

      // 绘制爱心正中央的大字“老婆”
      const centerFontSize = Math.min(width, height) * 0.085 * heartBeat;
      ctx.font = `bold ${centerFontSize.toFixed(1)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.fillStyle = '#fff0f5';
      ctx.shadowColor = '#ff2a7a';
      ctx.shadowBlur = 20;
      ctx.fillText(TEXT, centerX, centerY);

      // 重置阴影以免影响点击粒子性能
      ctx.shadowBlur = 0;

      // 绘制点击绽放粒子
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const bp = burstParticles[i];
        bp.x += bp.vx;
        bp.y += bp.vy;
        bp.vy += 0.04; // 轻微重力
        bp.life -= 0.022;

        if (bp.life <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        ctx.font = `bold ${bp.size}px "PingFang SC", sans-serif`;
        ctx.fillStyle = `rgba(255, 130, 175, ${bp.life})`;
        ctx.fillText(TEXT, bp.x, bp.y);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();
  </script>
</body>
</html>
